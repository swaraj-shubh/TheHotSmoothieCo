name: backend

# PR -> lint -> types -> migrations -> unit -> integration/e2e -> image build + scan
# main -> all of the above, then deploy to staging (auto) and verify health
# production -> manual "Run workflow" (or a v* tag), gated by the `production` environment's reviewers

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy this commit to production after checks pass"
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hsc, POSTGRES_PASSWORD: hsc, POSTGRES_DB: hsc_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hsc" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://hsc:hsc@127.0.0.1:5432/hsc_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Migrations apply, roll back, and match the models
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Integration + end-to-end tests
        run: pytest -q tests/integration tests/e2e
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hsc-backend:${{ github.sha }} .
      - name: Smoke test (app imports, config validates, worker module loads)
        run: |
          docker run --rm -e ENVIRONMENT=staging -e JWT_SECRET=$(openssl rand -hex 32) hsc-backend:${{ github.sha }} \
            python -c "import app.main, app.workers.runner; print('ok')"
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hsc-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, image]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy (runs `alembic upgrade head` as pre-deploy)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" && curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Wait until healthy
        run: |
          for i in $(seq 60); do
            curl -fsS "${{ vars.API_URL }}/health/ready" && exit 0
            sleep 10
          done
          echo "staging did not become healthy" && exit 1

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    needs: [check, image]
    runs-on: ubuntu-latest
    environment: production  # configure required reviewers on this environment in GitHub settings
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" && curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Wait until healthy
        run: |
          for i in $(seq 60); do
            curl -fsS "${{ vars.API_URL }}/health/ready" && exit 0
            sleep 10
          done
          echo "production did not become healthy" && exit 1
