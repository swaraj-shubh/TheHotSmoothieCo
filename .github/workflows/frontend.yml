name: frontend

# PR / main -> API types in sync -> lint -> typecheck -> build -> Playwright against a real, seeded API.
# Deploys are done by Vercel's Git integration (preview per PR, production on main); see docs/DEPLOYMENT.md.

on:
  pull_request:
    paths: ["frontend/**", "backend/app/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/app/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hsc, POSTGRES_PASSWORD: hsc, POSTGRES_DB: hsc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hsc" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://hsc:hsc@127.0.0.1:5432/hsc
      REDIS_URL: redis://127.0.0.1:6379/0
      PAYMENTS_PROVIDER: dev
      RUN_WORKER_IN_API: "true"
      BFF_SECRET: ci-bff-secret
      API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Start the API (migrated, demo catalog, an admin)
        working-directory: backend
        run: |
          python -m venv .venv && .venv/bin/pip install -q -e .
          .venv/bin/alembic upgrade head
          .venv/bin/python -m scripts.seed_demo
          ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD .venv/bin/python -m scripts.create_admin $E2E_ADMIN_EMAIL "CI Admin"
          nohup .venv/bin/uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 30); do curl -fsS localhost:8000/health/ready && exit 0; sleep 1; done; cat api.log; exit 1

      - run: npm ci
      - name: API types match the backend
        run: npm run api:types && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/api.log
          retention-days: 7
