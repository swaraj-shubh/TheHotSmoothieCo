services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hsc
      POSTGRES_PASSWORD: hsc
      POSTGRES_DB: hsc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsc"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment: &docker_env
      DATABASE_URL: postgresql+asyncpg://hsc:hsc@postgres:5432/hsc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment: *docker_env
    ports: ["8000:8000"]
    volumes: [./app:/app/app]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: python -m app.workers
    env_file: .env
    environment: *docker_env
    volumes: [./app:/app/app]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
